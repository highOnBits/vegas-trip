<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- Terrain texture dots -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>

  <!-- Subtle state border line (AZ/NV) -->
  <line x1="420" y1="0" x2="380" y2="800" stroke="#ffffff" stroke-width="0.5" opacity="0.08" stroke-dasharray="8 8"/>
  <text x="360" y="780" fill="#ffffff" opacity="0.06" font-family="monospace" font-size="11" text-anchor="middle">NEVADA</text>
  <text x="440" y="780" fill="#ffffff" opacity="0.06" font-family="monospace" font-size="11" text-anchor="middle">ARIZONA</text>

  <!-- ===== ROUTE LINES ===== -->

  <!-- Leg 1: Vegas → South Rim (Blue) — Day 1 -->
  <path d="M 200,350 C 320,360 450,280 580,220 Q 650,190 750,200 Q 820,210 880,280"
        stroke="#3b82f6" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <!-- Blue dashed overlay for motion effect -->
  <path d="M 200,350 C 320,360 450,280 580,220 Q 650,190 750,200 Q 820,210 880,280"
        stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="12 8" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Leg 2: South Rim → Page/Antelope Canyon (Red) — Day 1 evening -->
  <path d="M 880,280 Q 920,240 940,200 Q 960,160 950,130 Q 940,110 920,100 Q 880,80 840,120 Q 820,145 810,170"
        stroke="#ef4444" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <path d="M 880,280 Q 920,240 940,200 Q 960,160 950,130 Q 940,110 920,100 Q 880,80 840,120 Q 820,145 810,170"
        stroke="#f87171" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="12 8" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Leg 3: Antelope Canyon → Horseshoe Bend (Green) — Day 2 -->
  <path d="M 810,170 Q 800,190 790,210 Q 780,230 770,240"
        stroke="#22c55e" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>

  <!-- Leg 4: Horseshoe Bend → Vegas (White) — Day 2 return -->
  <path d="M 770,240 Q 700,300 600,350 Q 500,400 400,420 Q 300,430 230,390 Q 210,375 200,350"
        stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow)" opacity="0.7"/>
  <path d="M 770,240 Q 700,300 600,350 Q 500,400 400,420 Q 300,430 230,390 Q 210,375 200,350"
        stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="12 8" opacity="0.3">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- ===== LOCATION MARKERS ===== -->

  <!-- A: Las Vegas -->
  <circle cx="200" cy="350" r="18" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="200" cy="350" r="8" fill="#a78bfa" opacity="0.8"/>
  <text x="200" y="355" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">A</text>

  <!-- B: Grand Canyon South Rim -->
  <circle cx="880" cy="280" r="18" fill="#1e1b4b" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="880" cy="280" r="8" fill="#f59e0b" opacity="0.8"/>
  <text x="880" y="285" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">B</text>

  <!-- C: Antelope Canyon / Page -->
  <circle cx="810" cy="170" r="18" fill="#1e1b4b" stroke="#ec4899" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="810" cy="170" r="8" fill="#ec4899" opacity="0.8"/>
  <text x="810" y="175" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">C</text>

  <!-- D: Horseshoe Bend -->
  <circle cx="770" cy="240" r="18" fill="#1e1b4b" stroke="#22c55e" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="770" cy="240" r="8" fill="#22c55e" opacity="0.8"/>
  <text x="770" y="245" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">D</text>

  <!-- ===== LOCATION LABELS ===== -->

  <!-- Las Vegas label -->
  <rect x="80" y="385" width="240" height="60" rx="12" fill="#0f0f1f" stroke="#a78bfa" stroke-width="1.5" opacity="0.95" filter="url(#shadow)"/>
  <text x="200" y="406" fill="#a78bfa" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🎰 Las Vegas</text>
  <text x="200" y="430" fill="#9ca3af" font-family="monospace" font-size="12" text-anchor="middle">Start &amp; End</text>

  <!-- South Rim label -->
  <rect x="890" y="295" width="260" height="60" rx="12" fill="#0f0f1f" stroke="#f59e0b" stroke-width="1.5" opacity="0.95" filter="url(#shadow)"/>
  <text x="1020" y="316" fill="#f59e0b" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🏜️ Grand Canyon</text>
  <text x="1020" y="340" fill="#9ca3af" font-family="monospace" font-size="12" text-anchor="middle">South Rim</text>

  <!-- Antelope Canyon label -->
  <rect x="835" y="120" width="260" height="60" rx="12" fill="#0f0f1f" stroke="#ec4899" stroke-width="1.5" opacity="0.95" filter="url(#shadow)"/>
  <text x="965" y="141" fill="#ec4899" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">📸 Antelope Canyon</text>
  <text x="965" y="165" fill="#9ca3af" font-family="monospace" font-size="12" text-anchor="middle">Page, AZ</text>

  <!-- Horseshoe Bend label -->
  <rect x="560" y="215" width="200" height="60" rx="12" fill="#0f0f1f" stroke="#22c55e" stroke-width="1.5" opacity="0.95" filter="url(#shadow)"/>
  <text x="660" y="236" fill="#22c55e" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🌊 Horseshoe Bend</text>
  <text x="660" y="260" fill="#9ca3af" font-family="monospace" font-size="12" text-anchor="middle">Page, AZ</text>

  <!-- ===== DRIVE TIME LABELS ===== -->

  <!-- Blue: Vegas → South Rim -->
  <rect x="460" y="225" width="180" height="45" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" opacity="0.95"/>
  <text x="550" y="243" fill="#3b82f6" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🚐 4h 21m</text>
  <text x="550" y="261" fill="#60a5fa" font-family="monospace" font-size="10" text-anchor="middle">~280 miles</text>

  <!-- Red: South Rim → Page -->
  <rect x="920" y="180" width="160" height="45" rx="10" fill="#3f1219" stroke="#ef4444" stroke-width="1.5" opacity="0.95"/>
  <text x="1000" y="198" fill="#ef4444" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🚐 2h 30m</text>
  <text x="1000" y="216" fill="#f87171" font-family="monospace" font-size="10" text-anchor="middle">~140 miles</text>

  <!-- Green: Antelope → Horseshoe -->
  <rect x="715" y="185" width="70" height="30" rx="8" fill="#0f2e1a" stroke="#22c55e" stroke-width="1.5" opacity="0.95"/>
  <text x="750" y="205" fill="#22c55e" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">15m</text>

  <!-- White: Horseshoe → Vegas -->
  <rect x="380" y="420" width="180" height="45" rx="10" fill="#1a1a2e" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <text x="470" y="438" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🚐 4h 22m</text>
  <text x="470" y="456" fill="#9ca3af" font-family="monospace" font-size="10" text-anchor="middle">~280 miles</text>

  <!-- ===== LEGEND ===== -->
  <rect x="50" y="530" width="380" height="210" rx="16" fill="#0f0f1f" stroke="#374151" stroke-width="1.5" opacity="0.95" filter="url(#shadow)"/>
  <text x="80" y="560" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Road Trip Route</text>
  <text x="80" y="580" fill="#6b7280" font-family="monospace" font-size="12">Total: ~11h 22m driving • ~560 miles</text>

  <!-- Legend items -->
  <line x1="80" y1="610" x2="120" y2="610" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <text x="135" y="615" fill="#93c5fd" font-family="Arial, sans-serif" font-size="14">Vegas → South Rim (Day 1)</text>

  <line x1="80" y1="640" x2="120" y2="640" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <text x="135" y="645" fill="#fca5a5" font-family="Arial, sans-serif" font-size="14">South Rim → Page (Day 1 evening)</text>

  <line x1="80" y1="670" x2="120" y2="670" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <text x="135" y="675" fill="#86efac" font-family="Arial, sans-serif" font-size="14">Antelope Canyon → Horseshoe (Day 2)</text>

  <line x1="80" y1="700" x2="120" y2="700" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="135" y="705" fill="#d1d5db" font-family="Arial, sans-serif" font-size="14">Horseshoe Bend → Vegas (Day 2)</text>

  <!-- Small car emoji moving along the route -->
  <text font-size="24" filter="url(#softglow)">
    <animateMotion dur="12s" repeatCount="indefinite" rotate="auto"
      path="M 200,350 C 320,360 450,280 580,220 Q 650,190 750,200 Q 820,210 880,280 Q 920,240 940,200 Q 960,160 950,130 Q 940,110 920,100 Q 880,80 840,120 Q 820,145 810,170 Q 800,190 790,210 Q 780,230 770,240 Q 700,300 600,350 Q 500,400 400,420 Q 300,430 230,390 Q 210,375 200,350"/>
    🚐
  </text>
</svg>
